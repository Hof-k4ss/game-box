services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamebox-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${GAMEBOX_PORT:-6767}:80"
    volumes:
      - ${ROMS_DIR:-./roms}:/srv/roms:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    container_name: gamebox-api
    restart: unless-stopped
    environment:
      ROMS_DIR: /srv/roms
      BIOS_DIR: /srv/bios
    volumes:
      - ${ROMS_DIR:-./roms}:/srv/roms:ro
      - ${BIOS_DIR:-./bios}:/srv/bios:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  importer:
    build:
      context: ./importer
    profiles: ["tools"]
    environment:
      SOURCE_DIR: /source
      ROMS_DIR: /srv/roms
      DRY_RUN: ${IMPORT_DRY_RUN:-false}
    volumes:
      - ${ROM_SOURCE_DIR:-./incoming}:/source:ro
      - ${ROMS_DIR:-./roms}:/srv/roms
