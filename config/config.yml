# GameBox local configuration
# Mounted as /romm/config/config.yml

filesystem:
  roms_folder: "roms"
  firmware_folder: "bios"

scan:
  priority:
    language:
      - "fr"
      - "en"
    region:
      - "eu"
      - "fr"
      - "us"
      - "wor"
      - "jp"

emulatorjs:
  debug: false
  cache_limit: null
  disable_batch_bootup: false
  disable_auto_unload: false
  # Strict offline mode: current RomM EmulatorJS Netplay can load assets from
  # the public nightly CDN, so Netplay is disabled in the baseline profile.
  # Multiplayer on one browser/host keyboard does not require Netplay.
  netplay:
    enabled: false

  # Per-game/player keyboard mappings are intentionally configured from the
  # EmulatorJS Controls menu; browser keyboard names vary by layout.
