# GameBox local configuration
#
# This file is mounted into /romm/config/config.yml.
# Keep this configuration small so RomM defaults remain upgrade-safe.

filesystem:
  roms_folder: "roms"
  firmware_folder: "bios"

scan:
  priority:
    language:
      - "fr"
      - "en"
    region:
      - "eu"
      - "fr"
      - "us"
      - "wor"
      - "jp"

emulatorjs:
  debug: false
  cache_limit: null
  disable_batch_bootup: false
  disable_auto_unload: false
  netplay:
    # Enabled for testing on the isolated LAN. Do not assume every core/game
    # supports multiplayer; see docs/offline.md.
    enabled: true
    # No public STUN/TURN servers are configured here because this installation
    # must not depend on the Internet. Same-LAN WebRTC connectivity is tested
    # directly between browsers.
  controls:
    # P1: WASD + J/K/U/I + Enter/Shift
    # P2: arrows + numpad-style keys where the browser reports them.
    # Users can override mappings from EmulatorJS Menu -> Controls.
